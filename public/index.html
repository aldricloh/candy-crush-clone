<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#69c6ff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b1a3a" media="(prefers-color-scheme: dark)">
<meta name="description" content="A juicy fruit-matching puzzle game. Swipe to match 3, build specials, and clear jelly and ice across endless levels.">
<title>Orchard Pop</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Orchard Pop">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<svg id="scene" viewBox="0 0 400 800" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--sky1)"/><stop offset=".75" style="stop-color:var(--sky2)"/></linearGradient>
    <g id="cl"><circle cx="0" cy="0" r="18"/><circle cx="20" cy="-8" r="22"/><circle cx="42" cy="2" r="16"/><rect x="-6" y="0" width="56" height="16" rx="8"/></g>
    <g id="tr"><rect x="-5" y="0" width="10" height="34" rx="4" style="fill:var(--trunk)"/><circle cx="0" cy="-8" r="24" style="fill:var(--leaf)"/><circle cx="-14" cy="4" r="16" style="fill:var(--leaf)"/><circle cx="14" cy="4" r="16" style="fill:var(--leaf)"/><circle cx="-8" cy="-14" r="4" fill="#ff4f6d"/><circle cx="10" cy="-2" r="4" fill="#ff4f6d"/><circle cx="-12" cy="8" r="4" fill="#ffb11a"/><circle cx="6" cy="12" r="4" fill="#ff4f6d"/></g>
  </defs>
  <rect width="400" height="800" fill="url(#sky)"/>
  <circle cx="320" cy="120" r="44" style="fill:var(--sun)" opacity=".95"/>
  <g style="fill:var(--cloud)"><use href="#cl" x="40" y="110"/><use href="#cl" x="210" y="210" transform="scale(.8)"/><use href="#cl" x="300" y="300"/></g>
  <path d="M0 560 Q90 480 190 540 T400 520 V800 H0Z" style="fill:var(--hill1)"/>
  <use href="#tr" x="60" y="520"/><use href="#tr" x="330" y="505"/><use href="#tr" x="250" y="560" transform="translate(60 120) scale(.75)"/>
  <path d="M0 640 Q120 580 230 630 T400 610 V800 H0Z" style="fill:var(--hill2)"/>
  <use href="#tr" x="150" y="610"/>
  <path d="M0 720 Q140 680 260 715 T400 700 V800 H0Z" style="fill:var(--hill3)"/>
</svg>

<section id="title" class="screen on">
  <button class="ib corner snd" data-act="sound" aria-label="Toggle sound"></button>
  <h1 class="logo">Orchard<span>Pop</span></h1>
  <div class="fruitrow" aria-hidden="true"><b>🍓</b><b style="animation-delay:.15s">🍊</b><b style="animation-delay:.3s">🍋</b><b style="animation-delay:.45s">🍏</b><b style="animation-delay:.6s">🍇</b><b class="f6" style="animation-delay:.75s">🫐</b></div>
  <button class="btn" data-act="toMap" style="font-size:26px;min-width:200px">Play</button>
  <div class="tagline" id="tTag">Swipe or tap to swap fruit</div>
  <button class="btn alt sm" id="installBtn" data-act="install" hidden>Install app</button>
</section>

<section id="map" class="screen">
  <div class="mapbar">
    <button class="ib" data-act="home" aria-label="Back to title"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="mapname">Orchard Pop</div>
    <div class="pill"><svg class="star on" viewBox="0 0 24 24"><use href="#starP"/></svg><span id="mStars">0</span></div>
    <button class="ib snd" data-act="sound" aria-label="Toggle sound"></button>
  </div>
  <div id="mapScroll"><div id="mapInner"></div></div>
</section>

<section id="game" class="screen">
  <header id="hud">
    <div class="topbar">
      <button class="ib" data-act="pause" aria-label="Pause"><svg viewBox="0 0 24 24"><path d="M9 6v12M15 6v12"/></svg></button>
      <div class="lvname">Level <span id="hLv">1</span></div>
      <button class="ib snd" data-act="sound" aria-label="Toggle sound"></button>
    </div>
    <div class="sign">
      <div class="mv" id="hMv"><b id="hMoves">0</b><small>moves</small></div>
      <div class="goals" id="hGoals"></div>
      <div class="sc"><b id="hScore">0</b><div class="bar"><i id="hBar"></i><span class="mk" id="mk1"></span><span class="mk" id="mk2"></span><span class="mk" id="mk3"></span></div><small>score</small></div>
    </div>
  </header>
  <div id="stage">
    <div id="toast"></div>
    <div id="frame">
      <div id="board">
        <div class="grid8" id="cells"></div>
        <div id="tiles"></div>
        <div class="grid8" id="iceL" style="pointer-events:none"></div>
      </div>
      <div id="fx"></div>
      <div id="banner"></div>
    </div>
  </div>
</section>

<div id="modal" role="dialog" aria-modal="true"></div>
<svg width="0" height="0" style="position:absolute"><defs><path id="starP" d="M12 2.4l2.95 6.1 6.65.85-4.9 4.6 1.25 6.6L12 17.3l-5.95 3.25 1.25-6.6-4.9-4.6 6.65-.85z"/></defs></svg>

<script src="/js/game.js" defer></script>
</body>
</html>
